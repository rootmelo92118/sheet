<!DOCTYPE html>
<html>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
	integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
	integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
	crossorigin="anonymous"></script>
<link href="https://cdn.datatables.net/v/bs5/jq-3.7.0/dt-2.2.2/datatables.min.css" rel="stylesheet"
	integrity="sha384-WMi+Ec+QE8hxW/3qKvuefShIddYjwMalSgy0MR4FZnl285C4HGYfISceaagw0Am3" crossorigin="anonymous">

<script src="https://cdn.datatables.net/v/bs5/jq-3.7.0/dt-2.2.2/datatables.min.js"
	integrity="sha384-WcZXtPeSp12Ybwm08R/IL8F3bMhrj0WW6jKsqKXTqJSwCSkISe4unYVY8Vzc1RZc"
	crossorigin="anonymous"></script>
<script src="https://code.jquery.com/jquery-3.5.0.min.js"></script>

<style>
	.main-container {
		display: grid;
		grid-template-columns: 25% 450px 450px 25%;
		grid-template-rows: auto;
		grid-template-areas:
			"leftMenu leftMenu rightMenu rightMenu"
	}

	.left-container {
		grid-area: leftMenu;
	}

	.right-container {
		grid-area: rightMenu;
	}
</style>

<script>
	$(document).ready(
		function () {
			$('#table_id').DataTable();
		}
	);
</script>

<head>
	<meta charset="UTF-8">
	<title>0_0</title>
</head>

<body>
	<div class="main-container">
		<div class="left-container">
			<label for="labelOfIDNo" class="form-label">身分證字號 / 統一證號 / 統一編號 / 外國人稅籍編號</label>
			<div class="input-group mb-3">
				<input type="text" class="form-control" placeholder="身分識別碼" id="IDNo" aria-describedby="basic-addon1">
			</div>
			<label for="labelOfAlert" class="form-label">&nbsp;</label>
			<br>

			<label for="labelOfName" class="form-label">姓名</label>
			<div class="input-group mb-3">
				<input type="text" class="form-control" placeholder="姓名" id="name" aria-describedby="basic-addon2">
			</div>

			<label for="labelOfPhoneNumber" class="form-label">電話號碼</label>
			<div class="input-group mb-3">
				<input type="number" class="form-control" id="phoneNumber" placeholder="電話號碼" aria-describedby="basic-addon3">
			</div>

			<label for="labelOfAddress" class="form-label">地址</label>
			<div class="input-group mb-3">
				<input type="text" class="form-control" placeholder="地址" id="address">
			</div>

			<label for="labelOfNotice" class="form-label">備註</label>
			<div class="input-group mb-3">
				<input type="text" class="form-control" placeholder="備註" id="notice">
			</div>
			<button type="button" class="btn btn-outline-info">查詢</button>
			<button type="button" class="btn btn-outline-primary">新增</button>
			<button type="button" class="btn btn-outline-warning">修改</button>
			<button type="button" class="btn btn-outline-danger">刪除</button>
			<button type="button" class="btn btn-outline-dark">列表</button>
		</div>

		<div class="right-container">
			<table id="table_id" class="table table-striped" style="width:100%"></table>
		</div>
	</div>
</body>

</html>
