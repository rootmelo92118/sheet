<!DOCTYPE html>
<html>
<head>
    <title>個人資料維護</title>
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/v/dt/dt-1.13.6/datatables.min.css"/>
    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script type="text/javascript" charset="utf8" src="https://cdn.datatables.net/v/dt/dt-1.13.6/datatables.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#table_id').DataTable({
                "ajax": {
                    "url": "DataServlet?action=list", // Servlet 路徑和 action
                    "type": "POST",
                    "dataSrc": "" //  重要：指定 dataSrc 為空字串，因為 Servlet 直接返回 HTML
                },
                "columns": [ // 定義 DataTable 的列
                    { "data": "IDNo" },
                    { "data": "name" },
                    { "data": "phoneNumber" },
                    { "data": "address" },
                    { "data": "notice" },
                    { "data": null, "defaultContent": "", "render": function(data, type, row) { // 操作列
                        return '<button class="btn btn-warning btn-sm mdy" data-idno="' + row.IDNo + '" data-name="' + row.name + '" data-phonenumber="' + row.phoneNumber + '" data-address="' + row.address + '" data-notice="' + row.notice + '">修改</button>' +
                               '<button class="btn btn-danger btn-sm del" data-idno="' + row.IDNo + '">删除</button>';
                    } }
                ]
            });

            // 檢查身份證字號
            $('#checkIDNoButton').click(function() {
                $.ajax({
                    url: 'DataServlet',
                    type: 'POST',
                    data: {
                        action: 'checkIDNo',
                        IDNo: $('#IDNo').val()
                    },
                    success: function(response) {
                        if (response === 'valid') {
                            $('#IDNoError').text('');
                        } else {
                            $('#IDNoError').text('身份證字號檢碼不符');
                        }
                    },
                    error: function() {
                        alert('發生錯誤');
                    }
                });
            });

            // 查詢資料
            $('#queryButton').click(function() {
                $.ajax({
                    url: 'DataServlet',
                    type: 'POST',
                    data: {
                        action: 'query',
                        IDNo: $('#IDNo').val()
                    },
                    success: function(response) {
                        // 處理查詢結果
                        // ...
                    },
                    error: function() {
                        alert('發生錯誤');
                    }
                });
            });

            // 新增資料
            $('#addButton').click(function() {
                $.ajax({
                    url: 'DataServlet',
                    type: 'POST',
                    data: {
                        action: 'add',
                        IDNo: $('#IDNo').val(),
                        name: $('#name').val(),
                        phoneNumber: $('#phoneNumber').val(),
                        address: $('#address').val(),
                        notice: $('#notice').val()
                    },
                    success: function(response) {
                        if (response === 'inserted') {
                            alert('新增成功');
                            // ...
                        } else {
                            alert('新增失敗');
                        }
                    },
                    error: function() {
                        alert('發生錯誤');
                    }
                });
            });

            // 修改資料
            $('#updateButton').click(function() {
                $.ajax({
                    url: 'DataServlet',
                    type: 'POST',
                    data: {
                        action: 'update',
                        IDNo: $('#IDNo').val(),
                        name: $('#name').val(),
                        phoneNumber: $('#phoneNumber').val(),
                        address: $('#address').val(),
                        notice: $('#notice').val()
                    },
                    success: function(response) {
                        if (response === 'updated') {
                            alert('修改成功');
                            // ...
                        } else {
                            alert('修改失敗');
                        }
                    },
                    error: function() {
                        alert('發生錯誤');
                    }
                });
            });

            // 刪除資料
            $('#deleteButton').click(function() {
                $.ajax({
                    url: 'DataServlet',
                    type: 'POST',
                    data: {
                        action: 'delete',
                        IDNo: $('#IDNo').val()
                    },
                    success: function(response) {
                        if (response === 'deleted') {
                            alert('刪除成功');
                            // ...
                        } else {
                            alert('刪除失敗');
                        }
                    },
                    error: function() {
                        alert('發生錯誤');
                    }
                });
            });
        });
    </script>
</head>
<body>
    <table id="table_id" class="display"></table>
    <input type="text" id="IDNo" placeholder="身份證字號">
    <span id="IDNoError"></span><br>
    <input type="text" id="name" placeholder="姓名"><br>
    <input type="text" id="phoneNumber" placeholder="電話號碼"><br>
    <input type="text" id="address" placeholder="地址"><br>
    <input type="text" id="notice" placeholder="備註"><br>
    <button id="checkIDNoButton">檢查身份證字號</button>
    <button id="queryButton">查詢</button>
    <button id="addButton">新增</button>
    <button id="updateButton">修改</button>
    <button id="deleteButton">刪除</button>
</body>
</html>
